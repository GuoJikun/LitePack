[package]
name = "litepack-shell"
version = "0.1.0"
description = "LitePack Windows Shell Extension - IExplorerCommand COM DLL for Win11 context menu"
authors = ["_zhiqiu"]
license.workspace = true
edition = "2021"

[lib]
name = "litepack_shell"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.0", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
