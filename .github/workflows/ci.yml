name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (test + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core + cli
        run: cargo test --workspace

  gui:
    name: gui (frontend build + typecheck)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/litepack-gui/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: crates/litepack-gui
      - name: Typecheck
        run: pnpm exec vue-tsc --noEmit
        working-directory: crates/litepack-gui
      - name: Build
        run: pnpm exec vite build
        working-directory: crates/litepack-gui

  build:
    name: tauri build (${{ matrix.platform }})
    needs: [core, gui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: --no-bundle
          - platform: macos-latest
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/litepack-gui/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/litepack-gui/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: crates/litepack-gui
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked --locked
      - name: Build (bundle)
        run: cargo tauri build ${{ matrix.args }}
        working-directory: crates/litepack-gui
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litepack-${{ matrix.platform }}
          path: |
            crates/litepack-gui/src-tauri/target/release/bundle/**/*.exe
            crates/litepack-gui/src-tauri/target/release/bundle/**/*.msi
            crates/litepack-gui/src-tauri/target/release/bundle/**/*.dmg
            crates/litepack-gui/src-tauri/target/release/bundle/**/*.deb
            crates/litepack-gui/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
